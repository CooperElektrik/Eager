[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eager-runtime"
version = "0.5.0"
description = "Lightweight, headless narrative runtime and state machine for Eager-Script screenplays."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Cooper" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Text Processing :: Markup",
]
keywords = ["screenplay", "narrative-engine", "visual-novel", "interactive-fiction", "runtime", "eager"]

dependencies = [
    "eager-script >= 0.4.0",
    "eager-core >= 0.4.0",
]

[project.optional-dependencies]
graphics = [
    "eager-graphics >= 0.4.0",
]
lsp = [
    "eager-script-lsp >= 0.4.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "eager-graphics >= 0.4.0",
    "pyglet>=2.0",
]

[project.scripts]
eager = "eager_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eager_runtime = ["template/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "../.."
venv = ".venv"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eager-graphics"
version = "0.7.0"
description = "Renderer-agnostic, resolution-independent Graphics & Stage Compositor for Eager narrative runtimes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Cooper" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
keywords = [
    "screenplay",
    "narrative-engine",
    "visual-novel",
    "graphics",
    "compositor",
    "stage-management",
    "headless",
    "eager",
]

dependencies = [
    "eager-core >= 0.7.0",
    "eager-script >= 0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "eager-runtime >= 0.7.0",
    "miniaudio>=0.12.4",
]
hardware = [
    "pyglet>=2.0.0",
]
software = [
    "Pillow>=10.0.0",
]
# Opt-in SIMD build of the software backend.  Unlike ``software`` this installs
# the source-only ``pillow-simd`` fork, which compiles on the local machine and
# provides the same ``PIL`` import.  It is mutually exclusive with the regular
# ``Pillow`` distribution (uninstall one before installing the other); see
# ``scripts/install_pillow_simd.py`` for the supported swap-in workflow.
software-simd = [
    "pillow-simd>=10.0.0",
]
all = [
    "pyglet>=2.0.0",
    "Pillow>=10.0.0",
    "miniaudio>=0.12.4",
]
audio = [
    "miniaudio>=0.12.4",
]

[project.entry-points."eager.providers"]
graphics = "eager_graphics:register_providers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "../.."
venv = ".venv"

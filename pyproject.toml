[project]
name = "eager-engine"
version = "0.1.0"
description = "Unified visual novel engine ecosystem: parser (eager-script), runtime (eager-runtime), and graphics (eager-graphics)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cooper" }]
urls = { Homepage = "https://github.com/CooperElektrik/Eager", Repository = "https://github.com/CooperElektrik/Eager" }
dependencies = [
    "eager-core",
    "eager-graphics",
    "eager-runtime",
    "eager-script",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "pyglet>=2.0",
    "pillow>=10.0",
    "raylib>=6.0.0",
    "miniaudio>=0.12.4",
]

[tool.uv.sources]
eager-script = { workspace = true }
eager-runtime = { workspace = true }
eager-graphics = { workspace = true }
eager-core = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/eager-script",
    "packages/eager-runtime",
    "packages/eager-graphics",
    "packages/eager-core",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "eager-engine"
version = "0.9.0"
description = "Unified visual novel engine ecosystem: parser, VM, stage/UI, backends, CLI (eager), and LSP (eager-script-lsp)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cooper" }]
urls = { Homepage = "https://github.com/CooperElektrik/Eager", Repository = "https://github.com/CooperElektrik/Eager" }
dependencies = [
    "eager",
    "eager-script-lsp",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "pyglet>=2.0",
    "pillow>=10.0",
    "miniaudio>=0.12.4",
    "import-linter>=2.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.uv.sources]
eager = { workspace = true }
eager-script-lsp = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/eager",
    "packages/eager-script-lsp",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages"]

[tool.importlinter]
root_packages = [
    "eager",
    "eager_script_lsp",
]

# ---------------------------------------------------------------------------
# Cross-layer architectural boundaries
# ---------------------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "Eager layered architecture"
type = "layers"
layers = [
    "eager.cli",
    "eager.session",
    "eager.ui",
    "eager.stage",
    "eager.vm",
    "eager.script",
    "eager.core",
]

[[tool.importlinter.contracts]]
name = "eager.backends is independent of vm, stage, ui, session, cli"
type = "forbidden"
source_modules = ["eager.backends"]
forbidden_modules = [
    "eager.vm",
    "eager.stage",
    "eager.ui",
    "eager.session",
    "eager.cli",
]

[[tool.importlinter.contracts]]
name = "eager.core, eager.script, and eager.vm do not import eager.backends"
type = "forbidden"
source_modules = [
    "eager.core",
    "eager.script",
    "eager.vm",
]
forbidden_modules = ["eager.backends"]

[[tool.importlinter.contracts]]
name = "eager-script-lsp strictly forbids vm, stage, ui, session, backends, cli"
type = "forbidden"
source_modules = ["eager_script_lsp"]
forbidden_modules = [
    "eager.vm",
    "eager.stage",
    "eager.ui",
    "eager.session",
    "eager.backends",
    "eager.cli",
]

# ---------------------------------------------------------------------------
# Internal module boundaries
# ---------------------------------------------------------------------------

[[tool.importlinter.contracts]]
name = "eager renderer backends are mutually independent"
type = "independence"
modules = [
    "eager.backends.renderers.pil",
    "eager.backends.renderers.pyglet",
]

[[tool.importlinter.contracts]]
name = "eager.script expr and hooks are mutually independent"
type = "independence"
modules = [
    "eager.script.expr",
    "eager.script.hooks",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
reportUnusedCallResult = "none"
reportPrivateUsage = "none"
reportMissingTypeStubs = "none"
reportImplicitOverride = "none"

[[tool.basedpyright.executionEnvironments]]
root = "examples"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnknownLambdaType = "none"
reportUnannotatedClassAttribute = "none"
reportImplicitStringConcatenation = "none"

[[tool.basedpyright.executionEnvironments]]
root = "scripts"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnknownLambdaType = "none"
reportUnannotatedClassAttribute = "none"
reportImplicitStringConcatenation = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packaging"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnknownLambdaType = "none"
reportUnannotatedClassAttribute = "none"
reportImplicitStringConcatenation = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/eager/tests"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnknownLambdaType = "none"
reportUnannotatedClassAttribute = "none"
reportImplicitStringConcatenation = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/eager/benchmarks"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnknownLambdaType = "none"
reportUnannotatedClassAttribute = "none"
reportImplicitStringConcatenation = "none"

[[tool.basedpyright.executionEnvironments]]
root = "packages/eager-script-lsp/tests"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportUnknownLambdaType = "none"
reportUnannotatedClassAttribute = "none"
reportImplicitStringConcatenation = "none"

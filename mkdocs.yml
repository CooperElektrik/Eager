site_name: Eager
site_description: Visual novel engine ecosystem — parser, runtime, graphics, and LSP tooling.
site_url: https://cooperelektrik.github.io/Eager/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.action.edit
    - content.action.view
    - header.autohide
  logo: assets/logo.svg
  favicon: assets/favicon.svg

repo_url: https://github.com/CooperElektrik/Eager
repo_name: CooperElektrik/Eager
edit_uri: edit/master/docs/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/eager-core/src
            - packages/eager-script/src
            - packages/eager-runtime/src
            - packages/eager-graphics/src
            - packages/eager-script-lsp/src
          options:
            show_source: true
            show_if_no_docstring: true
            show_root_heading: true
            show_category_heading: true
            show_bases: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters: ["!^_", "!^__"]
            merge_init_into_class: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - Guides:
    - Architecture & Design:
      - Architecture: guides/architecture.md
      - Import Conventions: guides/import-conventions.md
    - Screenplay & DSL:
      - Expression Evaluation: guides/expression-evaluation.md
      - Hook Parsing: guides/hook-parsing.md
  - API Reference:
    - Overview: api/index.md
    - eager-core:
      - Overview: api/eager-core/index.md
      - Types: api/eager-core/types.md
      - Events: api/eager-core/events.md
      - Audio: api/eager-core/audio.md
      - Text: api/eager-core/text.md
      - Timing: api/eager-core/timing.md
      - Easing: api/eager-core/easing.md
      - Input: api/eager-core/input.md
      - Storage: api/eager-core/storage.md
      - i18n: api/eager-core/i18n.md
      - Protocols: api/eager-core/protocols.md
      - Exceptions: api/eager-core/exceptions.md
    - eager-script:
      - Overview: api/eager-script/index.md
      - Parser: api/eager-script/parser.md
      - Expressions: api/eager-script/expr.md
      - Scene Graph: api/eager-script/graph.md
      - Hooks: api/eager-script/hooks.md
      - Validator: api/eager-script/validator.md
      - CLI: api/eager-script/cli.md
    - eager-runtime:
      - Overview: api/eager-runtime/index.md
      - Story VM: api/eager-runtime/runtime.md
      - Session: api/eager-runtime/session.md
      - Dispatcher: api/eager-runtime/dispatcher.md
      - Saves: api/eager-runtime/saves.md
      - State: api/eager-runtime/state.md
      - Persistent Data: api/eager-runtime/persistent.md
      - Preferences: api/eager-runtime/preferences.md
      - Headless Runner: api/eager-runtime/headless.md
      - Assets: api/eager-runtime/assets.md
      - Backlog: api/eager-runtime/backlog.md
      - Terminal Player: api/eager-runtime/player.md
      - Project: api/eager-runtime/project.md
      - Watcher: api/eager-runtime/watcher.md
      - i18n: api/eager-runtime/i18n.md
      - CLI: api/eager-runtime/cli.md
    - eager-graphics:
      - Overview: api/eager-graphics/index.md
      - Compositor: api/eager-graphics/compositor.md
      - Director: api/eager-graphics/director.md
      - Stage: api/eager-graphics/stage.md
      - Layout: api/eager-graphics/layout.md
      - Timeline: api/eager-graphics/timeline.md
      - Types: api/eager-graphics/types.md
      - Protocol: api/eager-graphics/protocol.md
      - UI Components: api/eager-graphics/ui.md
      - Theme: api/eager-graphics/theme.md
      - Fonts: api/eager-graphics/fonts.md
      - Player: api/eager-graphics/player.md
      - Screens:
        - Overview: api/eager-graphics/screens/index.md
        - Screen Base: api/eager-graphics/screens/screen.md
        - Builtin Screens: api/eager-graphics/screens/builtin.md
        - Widgets: api/eager-graphics/screens/widgets.md
      - Renderers:

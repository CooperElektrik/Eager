site_name: Eager
site_description: Visual novel engine ecosystem — parser, runtime, graphics, and LSP tooling.
site_url: https://cooperelektrik.github.io/Eager/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.action.edit
    - content.action.view
    - header.autohide
  logo: assets/logo.svg
  favicon: assets/favicon.svg

repo_url: https://github.com/CooperElektrik/Eager
repo_name: CooperElektrik/Eager
edit_uri: edit/master/docs/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/eager-core/src
            - packages/eager-script/src
            - packages/eager-runtime/src
            - packages/eager-graphics/src
            - packages/eager-script-lsp/src
          options:
            show_source: true
            show_if_no_docstring: true
            show_root_heading: true
            show_category_heading: true
            show_bases: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters: ["!^_", "!^__"]
            merge_init_into_class: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - API Reference:
    - API Overview: api/index.md
    - eager-core: api/eager-core.md
    - eager-script: api/eager-script.md
    - eager-runtime: api/eager-runtime.md
    - eager-graphics: api/eager-graphics.md
    - eager-script-lsp: api/eager-script-lsp.md
  - Guides:
    - Architecture: guides/architecture.md
    - Import Conventions: guides/import-conventions.md
    - Expression Evaluation: guides/expression-evaluation.md
    - Hook Parsing: guides/hook-parsing.md
  - About:
    - Changelog: about/changelog.md
    - License: about/license.md

watch:
  - packages/eager-core/src
  - packages/eager-script/src
  - packages/eager-runtime/src
  - packages/eager-graphics/src
  - packages/eager-script-lsp/src
